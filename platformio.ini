; ESP32-C3 + SSD1306 128x32 OLED + KY-040 rotary encoder: Bambu Lab print monitor.
;
;   pio run -e esp32c3 -t upload     real firmware (needs include/secrets.h)
;   pio run -e demo   -t upload      fake printers, no Wi-Fi: preview the UI only
;   pio device monitor               serial log (115200)
;
; Build from a normal PowerShell / cmd window, not Git Bash: the pioarduino tool installer
; refuses to run under MSys.

[env]
; pioarduino = Arduino core 3.x (ESP-IDF 5) for PlatformIO. The older official platform ships a
; bootloader that boots silently into a loop on many ESP32-C3 boards (see "Troubleshooting").
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.30
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

[env:esp32c3]
; Boards with a CH340/CH343/CP210x USB-UART bridge: Serial goes through UART0 (GPIO20/21).
; Boards with native USB (e.g. ESP32-C3 SuperMini): delete the two USB defines below.
board = esp32-c3-devkitm-1
upload_speed = 460800
; Many ESP32-C3 boards cannot read their flash reliably at 80 MHz: the bootloader then fails with
; "partition 0 invalid magic number". 40 MHz DIO works everywhere.
board_build.f_flash = 40000000L
board_build.flash_mode = dio
; Bigger app partition (no OTA): the firmware is ~1.1 MB and the TLS certificate bundle adds more.
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0

[env:demo]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DDEMO_MODE=1

; ---- Other chips: build-tested only (not run on hardware), see the README compatibility table ----
; Each uses the default pins of settings.h for that chip and the board's default flash settings.
[env:esp32]
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32s2]
board = esp32-s2-saola-1
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=0
